[workspace]
members = [
    "apps/aurora-build",
    "crates/aurora-control-contracts",
    "crates/aurora-test-support",
    "crates/aurora-types",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false
license-file = "../../LICENSE"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
jsonschema = { version = "=0.53.0", default-features = false }
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["v7"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
