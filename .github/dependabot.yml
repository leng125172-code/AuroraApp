version: 2
updates:
  - package-ecosystem: cargo
    directory: /Sources/Rust
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
  - package-ecosystem: nuget
    directory: /Sources/DotNet
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, dotnet]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
